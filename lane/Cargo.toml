[package]
name = "pipe-read"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace and lockfile: the read lane shares no build inputs with the generation service.
[workspace]

[dependencies]
bytes = "1"
coreq = { git = "https://github.com/taskqorg/coreq", rev = "a6096f7ac1710d9e4735b3763ca3a42a853912e1" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-graceful", "tokio"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
libc = "0.2"
