[package]
name = "assetq"
version = "0.1.0"
edition = "2024"

[dependencies]
agentq-runtime = { git = "https://github.com/taskqorg/agentq", rev = "513193c8a96f3de1c71a86291a679230817ce0b2" }
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.18.0" }
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
