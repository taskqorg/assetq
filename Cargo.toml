[package]
name = "assetq"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
libc = "0.2"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
uuid = { version = "1.29.0", features = ["v4"] }
