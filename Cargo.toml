[package]
name = "pipe"
version = "0.1.0"
edition = "2024"

[dependencies]
agentq-runtime = { git = "https://github.com/taskqorg/agentq", rev = "f87f308a90b34564cb8ab6f3686ca09ffdde638f" }
base64 = "0.22.1"
coreq = { git = "https://github.com/taskqorg/coreq", tag = "v0.21.0" }
hex = "0.4.3"
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12"
ureq = "3"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_JobObjects"] }
