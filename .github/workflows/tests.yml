name: tests
on:
  push:
    branches: [main, 'taskq-*', 'codex/**']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check.py
