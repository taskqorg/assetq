name: tests
on:
  push:
    branches: [main, 'taskq-*', 'codex/**']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check.py
  candidate:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/candidate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipe-candidate
          path: dist/
          if-no-files-found: error
      - run: python3 scripts/candidate_read.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipe-read-candidate
          path: dist-read/
          if-no-files-found: error
